        <div class="frame">
            <canvas id="txtframe" width="1200" height="600"></canvas>
        </div>
        

        <script>
            const canvas = document.getElementById('txtframe');
            const ctx = canvas.getContext('2d');

            const title = 'Naming Concept';

            // paragraph width tuned for mid-size (tablet) screens rather than the full canvas
            const maxTextWidth = canvas.width * 0.65;
            const titleSize = 44;

            // wraps a single paragraph into lines that fit maxWidth, at word boundaries
            function wrapParagraph(text, maxWidth) {
                const words = text.split(' ');
                const lines = [];
                let current = '';
                for (const word of words) {
                    const test = current ? `${current} ${word}` : word;
                    if (current && ctx.measureText(test).width > maxWidth) {
                        lines.push(current);
                        current = word;
                    } else {
                        current = test;
                    }
                }
                if (current) lines.push(current);
                return lines;
            }

            // builds the txt image
            function layout(bodySize, paragraphs) {
                const lineHeight = Math.round(bodySize * 1.35);
                ctx.font = `${bodySize}px Archivo, sans-serif`;
                const lines = [];
                paragraphs.forEach((p, i) => {
                    lines.push(...wrapParagraph(p, maxTextWidth));
                    if (i < paragraphs.length - 1) lines.push(''); // gap between paragraphs
                });
                const titleHeight = titleSize + 24;
                const totalHeight = titleHeight + lines.length * lineHeight;
                return { lines, lineHeight, titleHeight, totalHeight };
            }

            function draw(paragraphs) {
                const margin = 30;
                const maxBlockHeight = canvas.height - margin * 2;
                let bodySize = 26;
                let result = layout(bodySize, paragraphs);
                while (result.totalHeight > maxBlockHeight && bodySize > 14) {
                    bodySize -= 1;
                    result = layout(bodySize, paragraphs);
                }
                const { lines, lineHeight, titleHeight } = result;

                // background
                ctx.fillStyle = '#020119';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                const x = (canvas.width - maxTextWidth) / 2;
                let y = Math.max(margin, (canvas.height - result.totalHeight) / 2);

                ctx.font = `bold ${titleSize}px Archivo, sans-serif`;
                ctx.fillStyle = '#ecedff';
                ctx.fillText(title, x, y);
                y += titleHeight;

                ctx.font = `${bodySize}px Archivo, sans-serif`;
                ctx.fillStyle = '#ecedff';
                lines.forEach(line => {
                    if (line) ctx.fillText(line, x, y);
                    y += lineHeight;
                });
            }

            fetch('namecncpts.txt')
                .then(response => response.text())
                .then(text => {
                    const paragraphs = text.trim().split(/\n\s*\n/);
                    draw(paragraphs);
                })
                .catch(err => console.error('Failed to load namecncpts.txt', err));
        </script>
